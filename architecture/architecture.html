<html><head>
<style>
  body { margin: 0; background: #0f1117; font-family: 'Anthropic Sans', sans-serif; }
  svg { display: block; width: 100%; }
  .node { cursor: pointer; }
  .node:hover rect, .node:hover polygon { opacity: 0.85; }

  /* Group label styles */
  .group-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }

  /* Arrow */
  .arr { stroke: #4a5568; stroke-width: 1px; fill: none; }
  .arr-dashed { stroke: #374151; stroke-width: 1px; fill: none; stroke-dasharray: 4 3; }

  /* Text */
  .t-title { font-size: 12px; font-weight: 600; fill: #f1f5f9; }
  .t-sub { font-size: 10px; font-weight: 400; fill: #94a3b8; }
  .edge-label { font-size: 9.5px; fill: #64748b; }

  /* Category colors - dark mode */
  /* Blue - HTTP Core */
  .cat-blue rect, .cat-blue polygon { fill: #1e3a5f; stroke: #3b82f6; stroke-width: 1px; }
  /* Amber - Domain */
  .cat-amber rect, .cat-amber polygon { fill: #3d2a00; stroke: #f59e0b; stroke-width: 1px; }
  /* Green - Data/Services */
  .cat-green rect, .cat-green polygon { fill: #0f2d1a; stroke: #22c55e; stroke-width: 1px; }
  /* Rose - Views */
  .cat-rose rect, .cat-rose polygon { fill: #3b0f1a; stroke: #f43f5e; stroke-width: 1px; }
  /* Indigo - Client */
  .cat-indigo rect, .cat-indigo polygon { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1px; }

  /* Group backgrounds */
  .grp-blue   { fill: #0d1f38; stroke: #1e3a5f; stroke-width: 1px; stroke-dasharray: 5 3; }
  .grp-amber  { fill: #1f1400; stroke: #3d2a00; stroke-width: 1px; stroke-dasharray: 5 3; }
  .grp-green  { fill: #071a0d; stroke: #0f2d1a; stroke-width: 1px; stroke-dasharray: 5 3; }
  .grp-rose   { fill: #1f0610; stroke: #3b0f1a; stroke-width: 1px; stroke-dasharray: 5 3; }
  .grp-indigo { fill: #0e0c2b; stroke: #1e1b4b; stroke-width: 1px; stroke-dasharray: 5 3; }

  /* group label text color per group */
  .lbl-blue   { fill: #3b82f6; }
  .lbl-amber  { fill: #f59e0b; }
  .lbl-green  { fill: #22c55e; }
  .lbl-rose   { fill: #f43f5e; }
  .lbl-indigo { fill: #818cf8; }
</style>
</head>
